
apiVersion: apps/v1
kind: Deployment
metadata:
  name: college-placement-portal
spec:
  replicas: 3
  selector:
    matchLabels:
      app: college-placement-portal
  template:
    metadata:
      labels:
        app: college-placement-portal
    spec:
      containers:
        - name: placement-portal
          image: perkeylynx/college-placement-portal:latest
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: college-placement-portal-service
spec:
  type: NodePort
  selector:
    app: college-placement-portal
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30033
